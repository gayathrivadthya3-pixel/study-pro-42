# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Details
spring.application.name=StudyPro42

# MySQL Database Configuration:
# Connects directly to MySQL database (or Aiven MySQL Cloud when AIVEN_DB_URL is supplied).
spring.datasource.url=${MYSQL_URL:${AIVEN_DB_URL:jdbc:mysql://localhost:3306/studypro42_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQL_USER:${AIVEN_DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${AIVEN_DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SMS Gateway Configuration
# For Indian mobile numbers, Fast2SMS (https://www.fast2sms.com) delivers instant SMS OTPs
sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
# Twilio configuration (optional)
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Static resource handling
spring.web.resources.static-locations=classpath:/static/,file:./src/main/resources/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.studypulse=INFO
logging.level.org.springframework.web=INFO
