# ==========================================================
# AIVEN CLOUD DATABASE CONFIGURATION GUIDE & TEMPLATE
# ==========================================================
#
# Step 1: Sign up / Log in to https://aiven.io
# Step 2: Create a free trial or new service:
#         Option A: Aiven for MySQL
#         Option B: Aiven for PostgreSQL
# Step 3: Copy Service URI or Connection Parameters from the Aiven Console Overview tab.
# Step 4: Set the following variables either in your environment, in this file, or run:
#
# FOR AIVEN MYSQL:
# ----------------
# AIVEN_DB_URL=jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/defaultdb?sslmode=REQUIRED&serverTimezone=UTC
# AIVEN_DB_USERNAME=avnadmin
# AIVEN_DB_PASSWORD=<YOUR_AIVEN_PASSWORD>
# AIVEN_DB_DRIVER=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#
# FOR AIVEN POSTGRESQL:
# --------------------
# AIVEN_DB_URL=jdbc:postgresql://<AIVEN_HOST>:<AIVEN_PORT>/defaultdb?sslmode=require
# AIVEN_DB_USERNAME=avnadmin
# AIVEN_DB_PASSWORD=<YOUR_AIVEN_PASSWORD>
# AIVEN_DB_DRIVER=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#
# ==========================================================
